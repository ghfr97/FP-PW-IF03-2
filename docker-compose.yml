version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: snowwash_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password_root_docker
      MYSQL_DATABASE: snowwash_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: snowwash_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=mysql://root:password_root_docker@db:3306/snowwash_db
      - PORT=5001
      - FRONTEND_URL=http://localhost:5173
      # Tambahkan environment lain dari .env backend jika perlu
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snowwash_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - backend

volumes:
  mysql_data:
